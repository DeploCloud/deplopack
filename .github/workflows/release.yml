name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      source_ref:
        description: Source commit to build (defaults to release tag)
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build standalone binaries
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist
          for binary in detector builder; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/deplopack-${binary}-linux-${arch}" "./cmd/${binary}"
            done
          done
          (cd dist && sha256sum deplopack-* > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p previous-release
            gh release download "$RELEASE_TAG" --dir previous-release
            gh release upload "$RELEASE_TAG" dist/deplopack-* --clobber
            gh release upload "$RELEASE_TAG" dist/checksums.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "DeploPack $RELEASE_TAG" --generate-notes
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

      - name: Preserve previous release assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: previous-release-assets
          path: previous-release/
          if-no-files-found: ignore
